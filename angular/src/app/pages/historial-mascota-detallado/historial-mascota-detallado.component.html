<div class="icon-container">
    <mat-icon class="back-icon" (click)="goBack()">reply</mat-icon>
</div>

<div class="container">
    <div class="titulo">
        <mat-icon class="icon-list">list_alt</mat-icon>
        <h1>Detalles de la consulta</h1>
    </div>

    <div class="container-data">
        <div class="info-consulta">

            <div class="container-data-mascota">

                <div class="form-group">
                    <label for="mascota">Mascota</label>
                    <input type="text" id="mascota" [(ngModel)]="consulta.mascota" name="mascota" disabled>
                </div>
                <div class="form-group">
                    <label for="diagnostico">Fecha</label>
                    <input type="text" id="fecha" [(ngModel)]="consulta.fechaCita" name="fecha" disabled>
                </div>
                <div class="form-group">
                    <label for="veterinario">Veterinario</label>
                    <input type="text" id="veterinario" [(ngModel)]="consulta.veterinario" name="veterinario" disabled>
                </div>

            </div>

            <label for="diagnostico">Diagnóstico</label>
            <textarea id="diagnostico" [(ngModel)]="consulta.diagnostico" name="diagnostico" rows="4" disabled></textarea>

            <label for="observaciones">Observaciones</label>
            <textarea id="observaciones" [(ngModel)]="consulta.observaciones" name="observaciones" rows="4" disabled></textarea>


        </div>
        <div class="tratamientos">

            <label>Detalle tratamientos:</label>
            <table>
                <thead>
                <tr>
                    <th>Tratamiento</th>
                    <th>Precio</th>
                </tr>
                </thead>
                <tbody>
                <tr *ngFor="let tratamiento of tratamientos">
                    <td>
                        <img [src]="tratamiento.icono" alt="Icono" class="icono" />
                        {{ tratamiento.nombre }}
                    </td>
                    <td>{{ tratamiento.precio | currency:'EUR' }}</td>
                </tr>
                </tbody>
                <tfoot>
                <mat-divider></mat-divider>
                <tr>
                    <td>Total</td>
                    <td>{{ total | currency:'EUR' }}</td>
                </tr>
                </tfoot>
            </table>

        </div>
    </div>
</div>
