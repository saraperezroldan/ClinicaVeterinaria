<div class="main-container">

  <div class="icon-container">
    <mat-icon class="back-icon" (click)="goBack()">reply</mat-icon>
  </div>

  <div class="data-containers">

    <div class="container">
    <div class="profile-section">
      <img alt="Profile Image" class="profile-image" src="https://www.shutterstock.com/image-vector/vector-flat-illustration-grayscale-avatar-600nw-2264922221.jpg"/>
    </div>

    <div class="container-data">
      <h2>Datos Personales</h2>
      <div class="subcontainer">
        <div class="details-section">
          <form (ngSubmit)="editarVeterinario()">
            <div class="row">
              <div class="half-width">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" [(ngModel)]="usuario.nombre" name="nombre"  required>
              </div>
              <div class="half-width">
                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" [(ngModel)]="usuario.apellidos" name="apellidos" required>
              </div>

            </div>
            <div class="row">
              <div class="half-width">
                <label for="dni">DNI</label>
                <input type="text" id="dni" [(ngModel)]="usuario.dni" name="dni" required>
              </div>
              <div class="half-width">
                <label for="telefono">Teléfono</label>
                <input type="text" id="telefono" [(ngModel)]="usuario.telefono" name="telefono" required>
              </div>
            </div>
            <div class="row">
              <div class="half-width">
                <label for="email">Email</label>
                <input type="email" id="email" [(ngModel)]="usuario.email" name="email" required>
              </div>
              <div class="half-width">
                <label for="direccion">Dirección</label>
                <input type="text" id="direccion" [(ngModel)]="usuario.direccion" name="direccion" required>
              </div>
            </div>
            <div class="row">
              <div class="half-width">
                <label for="poblacion">Población</label>
                <input type="text" id="poblacion" [(ngModel)]="usuario.poblacion" name="poblacion" required>
              </div>
              <div class="half-width">
                <label for="codigo-postal">Código postal</label>
                <input type="text" id="codigo-postal" [(ngModel)]="usuario.codigoPostal" name="codigoPostal" required>
              </div>
            </div>
            <div class="row">
              <div class="half-width">
                <label for="provincia">Provincia</label>
                <input type="text" id="provincia" [(ngModel)]="usuario.provincia" name="provincia" required>
              </div>
              <button type="submit" class="save-button">Guardar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

  </div>
  <div class="container-mascotas">
    <h2>Próximas consultas</h2>

    <div class="container-info-consultas">
      <div class="citas">

      </div>
      <div class="imagen-section" [routerLink]="[]">
        <img src="../../../assets/images/Imagen1.png" class="imagen"/>
        <p>Historial consultas</p>
      </div>


    </div>
  </div>
  </div>
</div>
